<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookStore</title>
    <link
      rel="shortcut icon"
      href="./assets/icons/book.png"
      type="image/x-icon" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="./styles/fonts.css" />

    <script src="script.js"></script>
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </head>
  <body onload="init()">
    <header class="head">
      <img src="./assets/img/bookstore-logo (1).png" alt="" />
    </header>
    <div class="nav">
      <button class="fav-btn" onclick="showFavDialog()">
        <span class="text">Favoriten</span>
      </button>
      <div class="cart-container">
        <button class="cart-btn" onclick="showCart()">Warenkorb</button>
      </div>
    </div>
    <section id="content" class="room"></section>
    <footer class="foot"></footer>
    <dialog id="fav-dialog" class="fav-dialog" onclick="closeDialog()">
      <h3 class="fav-headline">My Favourites</h3>
      <section
        onclick="bubbleProtection(event)"
        class="fav-section"
        id="section"></section>
    </dialog>
    <dialog id="cart" class="cart-dialog" onclick="closeCartDialog()">
      <h3 class="fav-headline">Shopping Cart</h3>
      <section onclick="bubbleProtection(event)" class="cart-section">
        <div id="cart-error"></div>
        <div id="shopping-cart" class="cart-container2"></div>
        <p id="total-price" class="final-price">Placeholder</p>
      </section>
    </dialog>
  </body>
</html>
